# Defaults for the e2e harness ("committed defaults in e2e/config.yaml").
#
# This file is the single home for published-port mapping. The ClickHouse
# skeleton does not publish any port — the harness probes ClickHouse by exec-ing
# clickhouse-client inside the container, and later services wire to it by IP —
# so nothing here is consumed yet. Later phases load this file and let flags
# override the values where a flag exists.
#
# Default publish map: the API alone. ClickHouse ports are present as commented
# examples (they are only needed when debugging CH from the host).
publish:
  api: "127.0.0.1:10888"
  # clickhouse_http:  "127.0.0.1:8123"
  # clickhouse_native: "127.0.0.1:9000"
